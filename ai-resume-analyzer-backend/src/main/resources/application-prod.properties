# ===================================================================
# PROD Profile: Cloud Deployment with Groq (Fast & Free)
# ===================================================================

# Exclude Ollama and unused OpenAI auto-configurations
# (Groq does not have an embeddings API, so OpenAiEmbeddingAutoConfiguration is excluded;
# AiConfig provides the embedding model dynamically)
spring.autoconfigure.exclude=\
  org.springframework.ai.model.ollama.autoconfigure.OllamaChatAutoConfiguration,\
  org.springframework.ai.model.ollama.autoconfigure.OllamaEmbeddingAutoConfiguration,\
  org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration,\
  org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration,\
  org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration,\
  org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration,\
  org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration

# Groq Cloud API (OpenAI-compatible)
spring.ai.openai.base-url=${GROQ_BASE_URL:https://api.groq.com/openai}
spring.ai.openai.api-key=${GROQ_API_KEY:gsk_placeholder_replace_with_real_groq_key}
spring.ai.openai.chat.options.model=${GROQ_CHAT_MODEL:llama-3.1-8b-instant}
spring.ai.openai.chat.options.temperature=0.3
spring.ai.openai.chat.options.max-tokens=2000

# Optional OpenAI Embedding (used by AiConfig if OPENAI_API_KEY is provided)
openai.api-key=${OPENAI_API_KEY:}
prod.embed.model=${PROD_EMBED_MODEL:text-embedding-3-small}

# Production Cookies (Secure + SameSite=None for cross-domain Vercel <-> Render)
app.cookie.secure=true

# OAuth2 Google Client
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:${REACT_APP_GOOGLE_CLIENT_ID:google-client-id-placeholder}}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:${REACT_APP_GOOGLE_CLIENT_SECRET:google-client-secret-placeholder}}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

