spring.application.name=ai-resume-analyzer
server.port=8080
server.forward-headers-strategy=framework

# Import .env file automatically if present
spring.config.import=optional:file:.env[.properties]

# Active profile: 'dev' for local Ollama, 'prod' for deployed Groq
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Database
spring.datasource.url=${DATABASE_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/resumeai}}
spring.datasource.username=${DATABASE_USERNAME:${SPRING_DATASOURCE_USERNAME:postgres}}
spring.datasource.password=${DATABASE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

spring.jmx.enabled=false
spring.devtools.livereload.enabled=false

# App & Security Settings
app.frontend.url=${FRONTEND_URL:http://localhost:3000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,https://ai-resume-analyzer-rag.vercel.app}}
app.jwt.secret=${JWT_SECRET:ai-resume-analyzer-secure-jwt-signing-key-minimum-256-bits-length-change-in-production!}
app.jwt.expiration-ms=86400000
app.jwt.remember-me-expiration-ms=2592000000
app.cookie.secure=${COOKIE_SECURE:false}

# OAuth2 Google Client
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:${REACT_APP_GOOGLE_CLIENT_ID:google-client-id-placeholder}}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:${REACT_APP_GOOGLE_CLIENT_SECRET:google-client-secret-placeholder}}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# File Upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Logging
logging.level.com.resumeai=INFO
logging.level.org.springframework.security=INFO
